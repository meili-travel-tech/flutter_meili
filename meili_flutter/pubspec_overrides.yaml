# Local development overrides — mirrors meili_flutter/example/pubspec_overrides.yaml.
#
# Without this, `flutter analyze`/`flutter test` in this package resolve the
# federated packages from pub.dev, so a method added to the platform interface
# in this repo but not yet published reads as `undefined_method` here even
# though the example (which does override) builds fine.
dependency_overrides:
  meili_flutter_platform_interface:
    path: ../meili_flutter_platform_interface
  meili_flutter_android:
    path: ../meili_flutter_android
  meili_flutter_ios:
    path: ../meili_flutter_ios
